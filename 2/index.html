<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÁO CÁO KỸ THUẬT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <style>
        :root { 
            --primary: #00d2ff; 
            --secondary: #3a7bd5; 
            --dark: #0f172a; 
            --card: #1e293b; 
            --border: rgba(255,255,255,0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 12px; 
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }
        
        #lock-screen { position: fixed; inset: 0; background: var(--dark); z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .login-box { width: 320px; padding: 30px; background: var(--card); border-radius: 20px; border: 1px solid var(--border); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; }
        
        input, select, textarea { 
            background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; 
            border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 12px; outline: none; transition: 0.3s; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.2); }
        
        .btn-save { 
            background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border: none; 
            padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; transition: transform 0.1s;
        }
        .btn-save:active { transform: scale(0.98); }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .table-container { 
            margin-top: 15px; border: 1px solid var(--border); border-radius: 12px; 
            overflow-x: auto; background: var(--card); box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 850px; }
        th { 
            background: #111827; color: var(--text-muted); font-size: 11px; font-weight: 600; 
            text-transform: uppercase; letter-spacing: 0.05em; padding: 14px 12px; border-bottom: 2px solid var(--border); text-align: left;
        }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; transition: 0.2s; }
        tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        tbody tr:hover td { background: rgba(0, 210, 255, 0.08); }

        .badge-tech { background: rgba(58, 123, 213, 0.2); color: #93c5fd; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .badge-mec { background: rgba(58, 123, 213, 0.2); color: #93c5ff; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); padding: 20px; }
        .modal-content { 
            background: var(--card); width: 95%; max-width: 600px; border-radius: 20px; border: 1px solid var(--primary); 
            padding: 25px; max-height: 85vh; display: flex; flex-direction: column;
        }
        #modalBody { overflow-y: auto; margin-top: 15px; padding-right: 5px; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .detail-item { display: flex; align-items: center; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 6px 0; }
        .detail-label { color: var(--text-muted); width: 95px; flex-shrink: 0; }
        .detail-value { color: var(--primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 480px) { .detail-grid { grid-template-columns: 1fr; } .detail-value { white-space: normal; } }
        
        #workDateDisplay { background: rgba(0, 210, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); font-weight: bold; cursor: pointer; text-align: center; }
        .btn-toggle-form { background: rgba(0, 210, 255, 0.05); color: var(--primary); border: 1px dashed var(--primary); padding: 12px; width: 100%; border-radius: 10px; margin-bottom: 15px; cursor: pointer; font-weight: 600; }
        #searchBox { border: 1px solid var(--primary); background: rgba(0, 210, 255, 0.05); margin-top: 10px; }

        #top-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(to right, var(--primary), #fff);
            z-index: 9999; transition: width 0.3s; width: 0%; display: none;
            box-shadow: 0 0 10px var(--primary);
        }

        #loading-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px); z-index: 4000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #toast-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10000; display: flex; flex-direction: column; align-items: center; pointer-events: none;
        }
        .toast {
            background: rgba(30, 41, 59, 0.95); color: white; padding: 16px 28px;
            border-radius: 12px; margin-bottom: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            animation: toastPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            min-width: 200px; text-align: center;
        }
        .toast.error { border-bottom: 3px solid #ef4444; }
        .toast.success { border-bottom: 3px solid #10b981; }
        .toast.info { border-bottom: 3px solid var(--primary); }

        @keyframes toastPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes toastFadeOut { to { transform: scale(0.8); opacity: 0; } }

        .login-box img, .header-logo {
            filter: drop-shadow(0 0 15px var(--primary)) brightness(1.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-box img { display: block; margin: 0 auto 20px auto; width: 220px; }
        .header-logo { height: 45px; vertical-align: middle; }
    </style>
</head>
<body>
    
<div id="toast-container"></div>
<div id="top-progress"></div>
<div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" style="color:var(--primary); font-weight:600; font-size:14px;">ĐANG XỬ LÝ...</div>
</div>
    
<div id="lock-screen">
    <div class="login-box">
        <img src="https://lh3.googleusercontent.com/pw/AP1GczNyKJCNBen1I6WeBIOFBHnduEAc-raKjpQsiE-xMOPlkgBLUxSUPtPfnGUO-h_gVE4xbhoZyycDSfpCjJD_uk7EkCLQJEXeuBytxHxBTDS0NEIMKC7RqBA-GIxKhZed7ddwzYsTmKsh5fKxggPZvFM=w483-h154" alt="Logo">
        <h3 style="color:var(--primary); margin:0 0 20px 0;">BÁO CÁO KỸ THUẬT</h3>
        <input type="text" id="userInput" placeholder="Tên đăng nhập">
        <input type="password" id="passInput" placeholder="Mật khẩu">
        <button class="btn-save" id="btnLogin" onclick="unlock()">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="container" id="main-content" style="display:none;">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
           <img src="https://lh3.googleusercontent.com/pw/AP1GczNyKJCNBen1I6WeBIOFBHnduEAc-raKjpQsiE-xMOPlkgBLUxSUPtPfnGUO-h_gVE4xbhoZyycDSfpCjJD_uk7EkCLQJEXeuBytxHxBTDS0NEIMKC7RqBA-GIxKhZed7ddwzYsTmKsh5fKxggPZvFM=w483-h154" class="header-logo" alt="Logo">
        </div>
        <div style="text-align: right">
            <span id="helloUser" style="color:var(--primary); font-size:13px; font-weight:600">---</span>
            <button onclick="logout()" style="color:#ef4444; background:none; border:none; cursor:pointer; margin-left:12px; font-size:12px; font-weight:bold">THOÁT</button>
            <small id="syncStatus" style="font-size:10px; color:var(--text-muted); display:block; margin-top:2px">Đang đồng bộ...</small>
        </div>
    </div>

    <button class="btn-toggle-form" id="toggleBtn" onclick="toggleForm()" style="display:none;">📑 BÁO CÁO MỚI</button>

    <div id="formContainer" style="display:none; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--primary); margin-bottom: 20px;">
        <input type="text" id="workDateDisplay" readonly onclick="document.getElementById('dateModal').style.display='flex'">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <select id="customer"><option value="">Tải khách hàng...</option></select>
            <select id="techName"><option value="">Tải kỹ thuật...</option></select>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <select id="machineType"><option value="">-- Loại máy --</option></select>
            <select id="supportType"><option value="">-- Hỗ trợ --</option></select>
        </div>

        <textarea id="content" placeholder="Mô tả công việc thực hiện (Bắt buộc)..." style="height:100px"></textarea>
        <input type="text" id="note" placeholder="Ghi chú thêm (Không bắt buộc)...">
        
        <button class="btn-save" id="btnSave" onclick="saveData()">LƯU BÁO CÁO</button>
    </div>

    <input type="text" id="searchBox" onkeyup="filterTable()" placeholder="🔍 Tìm kiếm nhanh (Máy, khách, nội dung...)">
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ngày làm</th>
                    <th>Khách hàng</th>
                    <th>Loại máy</th>
                    <th>Hỗ trợ</th>
                    <th>Nội dung</th>
                    <th>Kỹ thuật</th>
                    <th>Ghi chú</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="infoModal" class="modal" onclick="if(event.target==this) this.style.display='none'">
    <div class="modal-content">
        <h3 style="color:var(--primary); text-align:center; margin:0 0 20px 0">CHI TIẾT 🔎</h3>
        <div id="modalBody"></div>
        <button class="btn-save" style="margin-top:25px" onclick="document.getElementById('infoModal').style.display='none'">ĐÓNG</button>
    </div>
</div>

<div id="dateModal" class="modal" onclick="if(event.target==this) this.style.display='none'">
    <div class="modal-content" style="text-align:center">
        <h4 style="margin:0 0 15px 0">CHỌN NGÀY LÀM VIỆC</h4>
        <input type="date" id="hiddenDate" onchange="confirmDate(this.value)">
        <button class="btn-save" onclick="document.getElementById('dateModal').style.display='none'">XÁC NHẬN</button>
    </div>
</div>

<script>
    const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbynKdylaJX6JCuPJ_4roEAppNco5cHcFBtTj1AlXwxOp1AL3-3wyYSOqIu-nPrqbLJz/exec'; 
    let AUTH = JSON.parse(localStorage.getItem('tech_auth_v4')) || null;
    let USER_ROLE = "VIEWER";
    window.currentLogs = [];

    // Hàm mã hóa SHA-256 thuần khớp chính xác với GAS Utilities.ComputeDigest(Utilities.DigestAlgorithm.SHA_256)
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }

    document.addEventListener("DOMContentLoaded", () => {
        setInitialDate();
        checkSession();
        document.getElementById('passInput').addEventListener("keypress", (e) => { if(e.key === "Enter") unlock(); });
    });

    function checkSession() {
        const now = new Date().getTime();
        if (AUTH && AUTH.expire && now < AUTH.expire) {
            showApp();
            refresh();
            showToast(`Chào ${AUTH.user}! Hệ thống đã sẵn sàng`, "success");
        } else {
            localStorage.removeItem('tech_auth_v4');
            AUTH = null;
            document.getElementById('lock-screen').style.display = 'flex';
        }
    }

    async function unlock() {
        const u = document.getElementById('userInput').value.trim();
        const p = document.getElementById('passInput').value.trim();
        if(!u || !p) return showToast("Nhập đủ tài khoản/mật khẩu!", "error");
        
        showLoading(true, "ĐANG XÁC THỰC...");

        try {
            // Mã hóa mật khẩu sang SHA-256 trước khi gửi lên GAS
            const hashedPass = await sha256(p);

            const res = await fetch(GOOGLE_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "FETCH_DATA", user: u, pass: hashedPass })
            });
            const text = await res.text();
            showLoading(false);

            if (text === "AUTH_FAILED") {
                showToast("Sai tài khoản hoặc mật khẩu!", "error");
            } else {
                const data = JSON.parse(text);
                USER_ROLE = data.role;
                AUTH = { user: u, pass: hashedPass, expire: new Date().getTime() + (24 * 60 * 60 * 1000) };
                localStorage.setItem('tech_auth_v4', JSON.stringify(AUTH));
                showApp();
                renderData(data);
                applyPermissions();
                showToast(`Chào mừng ${u} trở lại!`, "success");
            }
        } catch (e) {
            showLoading(false);
            showToast("Lỗi kết nối máy chủ!", "error");
        }
    }

    function applyPermissions() {
        const btn = document.getElementById('toggleBtn');
        const form = document.getElementById('formContainer');

        if (USER_ROLE === "VIEWER") {
            if (btn) btn.style.display = "none";
            if (form) form.style.display = "none";
            window.toggleForm = function() { 
                showToast("Bạn không có quyền này", "error"); 
            };
        } else {
            if (btn) btn.style.display = "block";
        }
    }
    
    async function refresh() {
        const form = document.getElementById('formContainer');
        if (!AUTH || document.hidden || (form && form.style.display === "block")) return;

        try {
            const response = await fetch(GOOGLE_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "FETCH_DATA", user: AUTH.user, pass: AUTH.pass })
            });
            const data = await response.json();
            if (data && data !== "AUTH_FAILED") {
                USER_ROLE = data.role;
                renderData(data);
                applyPermissions();
            }
        } catch (e) { 
            console.warn("Đồng bộ định kỳ thất bại"); 
        }
    }

    async function saveData() {
        const d = document.getElementById('hiddenDate').value;
        const c = document.getElementById('customer').value;
        const t = document.getElementById('techName').value;
        const m = document.getElementById('machineType').value;
        const s = document.getElementById('supportType').value;
        const n = document.getElementById('content').value.trim();
        const note = document.getElementById('note').value.trim();
        
        if (!c || !n || !t || !m || !s) {
            return showToast("Vui lòng điền đủ: Khách hàng, Loại máy, Hỗ trợ, Kỹ thuật và Nội dung!", "error");
        }
        
        const btn = document.getElementById('btnSave'); 
        showLoading(true, "ĐANG LƯU NHẬT KÝ..."); 
        btn.disabled = true;

        try {
            const res = await fetch(GOOGLE_URL, { 
                method: 'POST', 
                body: JSON.stringify({ 
                    action: "SAVE_LOG", 
                    user: AUTH.user, 
                    pass: AUTH.pass, 
                    workDate: d, 
                    customer: c, 
                    tech: t, 
                    machineType: m,
                    support: s,
                    content: n,
                    note: note
                }) 
            });

            const result = await res.text();
            showLoading(false);

            if (result.includes("Thành công")) {
                showToast("Đã lưu nhật ký thành công!", "success");
                document.getElementById('content').value = ''; 
                document.getElementById('note').value = '';
                btn.disabled = false;
                toggleForm();
                refresh();
            } else {
                showToast("Lỗi từ máy chủ: " + result, "error");
                btn.disabled = false;
            }
        } catch (e) { 
            showLoading(false);
            showToast("Lỗi kết nối! Vui lòng kiểm tra mạng.", "error");
            btn.disabled = false; 
        }
    }

    function renderData(data) {
        if (USER_ROLE !== "VIEWER") {
            const updateDropdown = (id, newData, defaultText) => {
                const select = document.getElementById(id);
                if (!select) return;
                const currentValue = select.value;
                const newHtml = `<option value="">-- ${defaultText} --</option>` + 
                                newData.map(item => `<option value="${item}">${item}</option>`).join('');
                if (select.innerHTML !== newHtml) {
                    select.innerHTML = newHtml;
                    if ([...select.options].some(opt => opt.value === currentValue)) {
                        select.value = currentValue;
                    }
                }
            };

            if (data.customers) updateDropdown('customer', data.customers, 'Khách hàng');
            if (data.techs) updateDropdown('techName', data.techs, 'Kỹ thuật');
            if (data.machineTypes) updateDropdown('machineType', data.machineTypes, 'Loại máy');
            if (data.supports) updateDropdown('supportType', data.supports, 'Hỗ trợ');
        } else {
            ['customer', 'techName', 'machineType', 'supportType'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = '<option value="">Không có quyền truy cập</option>';
            });
        }

        window.currentLogs = data.logs.slice(1).reverse();
        const html = window.currentLogs.map((row, index) => `
            <tr onclick="openInfoModal(${index})">
                <td style="color:var(--text-muted)">${formatVN(row[1])}</td>
                <td><b style="color:var(--primary)">${row[2] || ''}</b></td>
                <td style="font-size:11px"><span class="badge-mec">${row[3] || ''}</span></td>
                <td><small>${row[4] || ''}</small></td>
                <td style="color:#cbd5e1">${(row[5]||"").substring(0,30)}${(row[5]||"").length>30?'...':''}</td>
                <td><span class="badge-tech">${row[6] || ''}</span></td>
                <td style="font-style:italic; color:var(--text-muted); font-size:12px">
                    ${(row[8] || '').substring(0,15)}${(row[8]||'').length > 15 ? '...' : ''}
                </td>
            </tr>
        `).join('');
        
        const tableBody = document.getElementById('tableBody');
        if (tableBody && tableBody.innerHTML !== html) {
            tableBody.innerHTML = html;
        }
        
        document.getElementById('syncStatus').innerText = "Cập nhật: " + new Date().toLocaleTimeString();
    }

    function openInfoModal(index) {
        const row = window.currentLogs[index];
        if(!row) return;

        document.getElementById('modalBody').innerHTML = `
            <div style="background:rgba(255,255,255,0.03); padding:15px; border-radius:12px; border:1px solid var(--border)">
                <div class="detail-grid">
                    <div class="detail-item"><span class="detail-label">🗓️ Ngày làm:</span><span class="detail-value">${formatVN(row[1])}</span></div>
                    <div class="detail-item"><span class="detail-label">🕵️‍♂️ Khách:</span><span class="detail-value">${row[2]}</span></div>
                    <div class="detail-item"><span class="detail-label">⚙️ Loại máy:</span><span class="detail-value">${row[3] || '---'}</span></div>
                    <div class="detail-item"><span class="detail-label">📌 Hỗ trợ:</span><span class="detail-value">${row[4] || '---'}</span></div>
                    <div class="detail-item"><span class="detail-label">👷‍♂️ Kỹ thuật:</span><span class="detail-value">${row[6]}</span></div>
                    <div class="detail-item"><span class="detail-label">🪪 User:</span><span class="detail-value">${row[7] || '---'}</span></div>
                </div>
                <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px">
                    <p style="margin:0 0 5px 0; color:var(--text-muted); font-size:11px; font-weight:600">📝 NỘI DUNG CÔNG VIỆC:</p>
                    <div style="white-space:pre-wrap; color:#fff; background:rgba(0,0,0,0.3); padding:12px; border-radius:10px; font-size:14px; line-height:1.6">${row[5]}</div>
                </div>
                <div style="margin-top:10px">
                    <p style="margin:0 0 5px 0; color:var(--text-muted); font-size:11px; font-weight:600">🗒️ GHI CHÚ:</p>
                    <div style="color:var(--primary); font-style:italic; font-size:13px">${row[8] || 'Không có ghi chú.'}</div>
                </div>
                <div style="margin-top:10px; font-size:10px; color:rgba(255,255,255,0.1); text-align:right">Log ID: ${formatVN(row[0])}</div>
            </div>
        `;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function showApp() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('helloUser').innerText = "Chào, " + AUTH.user;
    }

    function logout() {
        showToast("Đã đăng xuất hệ thống", "info");
        setTimeout(() => {
            localStorage.removeItem('tech_auth_v4');
            location.reload();
        }, 1000);
    }

    function setInitialDate() {
        const iso = new Date().toISOString().split('T')[0];
        document.getElementById('hiddenDate').value = iso;
        document.getElementById('workDateDisplay').value = formatVN(iso);
    }

    function confirmDate(v) { 
        document.getElementById('workDateDisplay').value = formatVN(v); 
        document.getElementById('dateModal').style.display = 'none'; 
    }

    function formatVN(dStr) {
        if (!dStr) return '';
        const d = new Date(dStr);
        return isNaN(d) ? dStr : d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getFullYear();
    }

    function toggleForm() {
        const f = document.getElementById('formContainer');
        const isHidden = f.style.display === "none";
        f.style.display = isHidden ? "block" : "none";
        document.getElementById('toggleBtn').innerHTML = isHidden ? "📒 THU GỌN" : "📑 BÁO CÁO MỚI";
    }

    function filterTable() {
        const v = document.getElementById('searchBox').value.toUpperCase();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        for (let r of rows) { r.style.display = r.innerText.toUpperCase().includes(v) ? "" : "none"; }
    }

    function showLoading(status, text = "ĐANG XỬ LÝ...") {
        const overlay = document.getElementById('loading-overlay');
        const bar = document.getElementById('top-progress');
        document.getElementById('loading-text').innerText = text;
        
        if(status) {
            overlay.style.display = 'flex';
            bar.style.display = 'block';
            bar.style.width = '70%';
        } else {
            bar.style.width = '100%';
            setTimeout(() => {
                overlay.style.display = 'none';
                bar.style.display = 'none';
                bar.style.width = '0%';
            }, 300);
        }
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = 'ℹ️';
        if(type === 'error') { icon = '⚠️'; }
        if(type === 'success') { icon = '✅'; }
        
        toast.innerHTML = `
            <div style="font-size: 30px; margin-bottom: 5px;">${icon}</div>
            <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.5px;">${message.toUpperCase()}</div>
        `;
        
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'toastFadeOut 0.2s ease-in forwards';
            setTimeout(() => toast.remove(), 200);
        }, 2500);
    }

    setInterval(refresh, 30000); 
</script>
</body>
</html>
